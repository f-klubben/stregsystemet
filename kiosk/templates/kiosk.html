{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>F-Klubben</title>

    <link href="{% static "kiosk/kiosk.css" %}" rel="stylesheet">
</head>

<body>
    <div class="dummy front"></div>
    <div class="dummy"></div>

    <script>
    var queue = [].slice.call(document.querySelectorAll(".dummy"));
    var front = queue.shift();
    var this_id = -1;
    var currentDuration = 10000;

    function swap(tag) {
        //Flip in the DOM
        front.classList.remove("front");

        queue.push(front);
        front = queue.shift();

        front.classList.add("front");
    }

    function updateKiosk() {
        var hidden = queue[0];
        var duration = currentDuration;
        var xmlHttp = new XMLHttpRequest();
        xmlHttp.onreadystatechange = function() {
            if (xmlHttp.readyState != 4) {
                return;
            }
            if (xmlHttp.status == 200) {
                obj = JSON.parse(xmlHttp.responseText);
                this_id = obj.id;
                hidden.style.backgroundImage = '';
                if (obj.has_media) {
                    if (!obj.is_image) {
                        hidden.style.backgroundImage = '';
                        hidden.innerHTML = //
                            '<center class="scale">' + //
                            '<video class="scale" autoplay muted loop id="video"><source src="' + obj.url + '" type="video/mp4">' + //
                            '</video>'+ //
                            '</center>';
                    } else {
                        hidden.innerHTML = '';
                        hidden.style.backgroundImage = 'url("' + obj.url +'")';
                    }
                } else {
                    hidden.style.backgroundImage = '';
                    hidden.innerHTML = 
                        '<iframe class="scale" ' +
                        'src="' + obj.url + '" ' +
                        'style="width:100%;height:100%;border:none;"></iframe>';
                }

                duration = obj.duration || 10000;
            } else {
                // Response received, but no image was sent from server
                hidden.style.backgroundImage = 'url("{% static "kiosk/kioskbg.png" %}")';
                this_id = -1;
            }
        }

        //Start by asking random for the first image
        if(this_id === -1) {
            xmlHttp.open("GET", "/kiosk/random", true);
        } else {
            xmlHttp.open("GET", "/kiosk/next_real/" + this_id + "/", true);
        }
        xmlHttp.send(null);

        // Swap in the loaded item once the visible item is done
        setTimeout(function() {
            swap();
            currentDuration = duration;
            updateKiosk();
        }, currentDuration);
    }

    // Initial call to start the cycle
    updateKiosk();

    </script>
</body>

</html>
