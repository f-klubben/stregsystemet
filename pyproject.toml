[project]
name = "stregsystemet"
version = "2.7.0"
description = "The Stregsystem is used at F-Klubben to pay for goods bought at Strandvejen and for signup to various events held by F-klubben."
authors = [
  { name = "FIT" }
]
license = { file = "LICENSE" }
requires-python = "==3.11.*"
readme = "README.md"
dependencies = [
    "coverage==7.13.5",
    "debugpy==1.8.16",
    "django==4.1.13",
    "django-debug-toolbar==4.3.0",
    "django-select2==8.2.3",
    "freezegun==1.5.1",
    "pytz==2026.1",
    "qrcode==8.2",
    "requests==2.33.0",
]

[tool.stregsystemet]
api-version = "1.2"

[tool.setuptools.packages.find]
include = ["stregsystem", "treo", "media", "kiosk", "razzia", "openapi", "stregreport"]
